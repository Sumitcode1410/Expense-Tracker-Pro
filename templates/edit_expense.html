{% extends "base.html" %}

{% block title %}Edit Expense - ExpenseTracker Pro{% endblock %}

{% block content %}

<div class="page-header">
    <h1>Edit Expense ✏️</h1>
    <p>Update your expense details</p>
</div>

<div class="form-card">

    <form method="POST">

        <div class="form-group">
            <label>Date</label>
            <input
                type="date"
                name="date"
                value="{{ expense['date'] }}"
                required
            >
        </div>

        <div class="form-group">
            <label>Amount</label>
            <input
                type="number"
                name="amount"
                step="0.01"
                value="{{ expense['amount'] }}"
                required
            >
        </div>

        <div class="form-group">
            <label>Category</label>
            <select name="category" required>

                <option value="Food"
                    {% if expense['category'] == 'Food' %}selected{% endif %}>
                    Food
                </option>

                <option value="Travel"
                    {% if expense['category'] == 'Travel' %}selected{% endif %}>
                    Travel
                </option>

                <option value="Shopping"
                    {% if expense['category'] == 'Shopping' %}selected{% endif %}>
                    Shopping
                </option>

                <option value="Bills"
                    {% if expense['category'] == 'Bills' %}selected{% endif %}>
                    Bills
                </option>

                <option value="Education"
                    {% if expense['category'] == 'Education' %}selected{% endif %}>
                    Education
                </option>

                <option value="Other"
                    {% if expense['category'] == 'Other' %}selected{% endif %}>
                    Other
                </option>

            </select>
        </div>

        <div class="form-group">
            <label>Description</label>
            <input
                type="text"
                name="description"
                value="{{ expense['description'] or '' }}"
            >
        </div>

        <div class="form-group">
            <label>Notes</label>
            <textarea name="notes">{{ expense['notes'] or '' }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="primary-btn">
                Save Changes
            </button>

            <a href="/expenses" class="secondary-btn">
                Cancel
            </a>
        </div>

    </form>

</div>

{% endblock %}
