<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password | ExpenseTracker Pro</title>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        background: #050816;
        color: white;
        font-family: Arial, sans-serif;
      }

      .reset-card {
        width: 360px;
        padding: 30px;

        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(139, 92, 246, 0.3);
        border-radius: 16px;

        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
      }

      h2 {
        text-align: center;
        margin-bottom: 8px;
      }

      .subtitle {
        text-align: center;
        color: #94a3b8;
        font-size: 14px;
        margin-bottom: 25px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;

        border: 1px solid #334155;
        border-radius: 8px;

        background: #0f172a;
        color: white;

        margin-bottom: 16px;
        outline: none;
      }

      input:focus {
        border-color: #8b5cf6;
      }

      .password-box {
        position: relative;
      }

      .password-box input {
        padding-right: 45px;
      }

      .show-password {
        position: absolute;
        right: 10px;
        top: 40%;
        transform: translateY(-50%);

        background: transparent;
        border: none;
        color: white;
        cursor: pointer;
        font-size: 17px;
      }

      .error-message {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.35);
        color: #fca5a5;

        padding: 10px;
        border-radius: 8px;

        text-align: center;
        font-size: 13px;
        margin-bottom: 15px;
      }

      .reset-btn {
        width: 100%;
        padding: 12px;

        background: #8b5cf6;
        color: white;

        border: none;
        border-radius: 8px;

        cursor: pointer;
        font-size: 15px;
      }

      .reset-btn:hover {
        background: #7c3aed;
      }

      .back-link {
        display: block;
        text-align: center;
        margin-top: 18px;

        color: #a78bfa;
        text-decoration: none;
        font-size: 14px;
      }

      input[type="password"]::-ms-reveal,
      input[type="password"]::-ms-clear {
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="reset-card">
      <h2>Reset Password</h2>

      <p class="subtitle">Enter your Gmail and create a new password.</p>

      <form method="POST" action="/reset-password">
        <label for="email">Gmail</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your Gmail"
          required
        />

        <label for="new_password">New Password</label>

        <div class="password-box">
          <input
            type="password"
            id="new_password"
            name="new_password"
            placeholder="Enter new password"
            required
          />

          <button
            type="button"
            class="show-password"
            onclick="togglePassword('new_password', this)"
          >
            👁
          </button>
        </div>

        <label for="confirm_password">Confirm Password</label>

        <div class="password-box">
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm new password"
            required
          />

          <button
            type="button"
            class="show-password"
            onclick="togglePassword('confirm_password', this)"
          >
            👁
          </button>
        </div>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <button type="submit" class="reset-btn">Reset Password</button>
      </form>

      <a href="/signin" class="back-link"> ← Back to Sign In </a>
    </div>

    <script>
      function togglePassword(id, button) {
        const password = document.getElementById(id);

        if (password.type === "password") {
          password.type = "text";
          button.textContent = "👁️";
        } else {
          password.type = "password";
          button.textContent = "👁";
        }
      }
    </script>
  </body>
</html>
